name: Daily Govt Mandi Bhav Sync

on:
  schedule:
    # यह UTC टाइम है - भारत में सुबह 7:00 बजे अपने आप चलेगा (1:30 AM UTC)
    - cron: '30 1 * * *'
  workflow_dispatch: # यह बटन देगा जिससे आप जब चाहें मैन्युअली भी चला सकते हैं

jobs:
  sync-mandi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase JS
        run: npm install @supabase/supabase-js

      - name: Run Fetch Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: node scripts/fetch-mandi.mjs